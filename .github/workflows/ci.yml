name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate and rebuild web assets
        run: |
          npm --prefix web ci
          npm --prefix web run build
          npm --prefix web audit --audit-level=moderate
          git diff --exit-code -- internal/serverui/dist
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Lint CloudFormation templates
        run: make lint-templates
      - name: Validate
        run: |
          go test -race ./...
          npm --prefix web test
          go vet ./...
          python3 generate-compose.py --check
          docker compose config --quiet
      - name: Check launch page in Chromium
        run: |
          uv run --no-project --with playwright==1.65.1 playwright install --only-shell chromium
          make test-browser
      - name: Package supported targets
        run: python3 scripts/package-release.py --output /tmp/insta-game-dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: insta-game-packages
          path: /tmp/insta-game-dist/*
