name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@v6
      - name: Lint CloudFormation templates
        run: make lint-templates
      - name: Validate
        run: |
          go test -race ./...
          node --test internal/control/settings_test.mjs
          go vet ./...
          python3 generate-compose.py --check
          docker compose config --quiet
      - name: Build supported targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/insta-game-linux-arm64 ./cmd/insta-game
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/insta-game-darwin-arm64 ./cmd/insta-game
