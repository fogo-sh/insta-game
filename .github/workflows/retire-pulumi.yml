name: Retire old Pulumi stack

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, destroy]
        default: audit
      expected_account:
        description: AWS account from the reviewed audit (required for destroy)
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pulumi-${{ vars.PULUMI_STACK }}
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_STACK: ${{ vars.PULUMI_STACK }}
      PULUMI_RUN_PROGRAM: 'false'
      MODE: ${{ inputs.mode }}
      EXPECTED_ACCOUNT: ${{ inputs.expected_account }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ca-central-1
      - uses: pulumi/actions@v6
      - name: Inspect recorded resources and preview deletion
        shell: bash
        run: |
          set -euo pipefail
          test "$PULUMI_STACK" = prod
          test "$PULUMI_BACKEND_URL" = 's3://insta-game-pulumi-state-fogo-sh?region=ca-central-1&awssdk=v2'
          mkdir "$RUNNER_TEMP/retire"
          git show 89eb6bd:pulumi/Pulumi.yaml > "$RUNNER_TEMP/retire/Pulumi.yaml"
          git show 89eb6bd:pulumi/Pulumi.prod.yaml > "$RUNNER_TEMP/retire/Pulumi.prod.yaml"
          cd "$RUNNER_TEMP/retire"
          aws sts get-caller-identity > identity.json
          cat identity.json
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack ls --json | jq '[.[] | {name,resourceCount}]'
          pulumi stack select "$PULUMI_STACK" --non-interactive
          pulumi stack export --file before.json
          jq '[.deployment.resources[]? | {urn,type,id,custom,protect,retainOnDelete}]' before.json
          pulumi destroy --stack "$PULUMI_STACK" --preview-only --non-interactive --suppress-outputs
      - name: Destroy only the audited stack
        if: inputs.mode == 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/retire"
          test -n "$EXPECTED_ACCOUNT"
          test "$(jq -r .Account identity.json)" = "$EXPECTED_ACCOUNT"
          jq -e '[.deployment.resources[]? | select(.protect == true or .retainOnDelete == true)] | length == 0' before.json
          aws s3 cp before.json "s3://insta-game-pulumi-state-fogo-sh/.pulumi/backups/insta-game/retirement-$GITHUB_RUN_ID-before.json" --sse AES256 --only-show-errors
          pulumi destroy --stack "$PULUMI_STACK" --yes --non-interactive --suppress-outputs
          pulumi stack export --file after.json
          jq -e '[.deployment.resources[]? | select(.custom == true and (.type | startswith("pulumi:providers:") | not))] | length == 0' after.json
          aws s3 cp after.json "s3://insta-game-pulumi-state-fogo-sh/.pulumi/backups/insta-game/retirement-$GITHUB_RUN_ID-after.json" --sse AES256 --only-show-errors
      - name: Verify AWS resources are absent
        if: inputs.mode == 'destroy'
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import json
          import subprocess

          def absent(label, region, args, code):
              result = subprocess.run(["aws", "--region", region, *args], capture_output=True, text=True)
              if result.returncode == 0 or f"({code})" not in result.stderr:
                  raise SystemExit(f"{label}: absence not confirmed: {result.stderr}")
              print(f"{label}: absent")

          absent("VPC", "us-east-2", ["ec2", "describe-vpcs", "--vpc-ids", "vpc-01652f6868f7bf245"], "InvalidVpcID.NotFound")
          absent("Lambda", "us-east-2", ["lambda", "get-function", "--function-name", "insta-game-launcher-us-east-2"], "ResourceNotFoundException")
          absent("CloudFront", "us-east-1", ["cloudfront", "get-distribution", "--id", "E27D4E4YCZICM0"], "NoSuchDistribution")
          absent("Certificate", "us-east-1", ["acm", "describe-certificate", "--certificate-arn", "arn:aws:acm:us-east-1:962706792249:certificate/32b077ec-e4eb-4751-b8a1-15f77a98c14f"], "ResourceNotFoundException")
          for name in ["lambda", "ecs-task", "ecs-execution"]:
              absent(f"{name} role", "us-east-2", ["iam", "get-role", "--role-name", f"insta-game-{name}-role-us-east-2-792249"], "NoSuchEntity")
          result = subprocess.check_output(["aws", "--region", "us-east-2", "ecs", "describe-clusters", "--clusters", "insta-game-cluster-us-east-2"])
          data = json.loads(result)
          assert all(c["status"] == "INACTIVE" for c in data.get("clusters", [])), data
          assert all(f["reason"] == "MISSING" for f in data.get("failures", [])), data
          print("ECS cluster: inactive or absent")
          PYVERIFY
